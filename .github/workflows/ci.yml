name: Source loader checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  loader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies
        run: python -m pip install numpy==2.5.4 scipy==1.18.1
      - name: Check all Python source syntax
        run: python -m compileall -q outputs check_environment.py
      - name: Test transactional loading with synthetic files
        run: python -m unittest discover -s outputs/time_stratigraphy_preview -p test_project_loader.py -v
